name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m compileall -q skills/agents-spec/scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validators
        run: >-
          python -m pip install
          ruff==0.16.3
          git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref
      - name: Run Ruff checks
        run: |
          ruff check skills tests
          ruff format --check skills tests
      - name: Validate Agent Skill format
        run: skills-ref validate skills/agents-spec
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - name: Validate cross-agent discovery
        run: npx --yes skills@1.5.23 add . --list
